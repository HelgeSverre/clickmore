name: Signed release

on:
  push:
    branches: [main]
    paths: [Resources/Info.plist]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clickmore-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Select release Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Test release source
        run: swift test
      - name: Resolve version and existing release
        id: version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
          # List explicitly so an API/network error cannot masquerade as a missing release.
          gh api --paginate repos/HelgeSverre/clickmore/releases > "$RUNNER_TEMP/releases.json"
          existing=$(jq --arg tag "v$version" -s '[.[][] | select(.tag_name == $tag)] | length' "$RUNNER_TEMP/releases.json")
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
      - name: Import signing and notarization credentials
        if: steps.version.outputs.existing == '0'
        env:
          CLICKMORE_APP_P12_BASE64: ${{ secrets.CLICKMORE_APP_P12_BASE64 }}
          CLICKMORE_INSTALLER_P12_BASE64: ${{ secrets.CLICKMORE_INSTALLER_P12_BASE64 }}
          CLICKMORE_P12_PASSWORD: ${{ secrets.CLICKMORE_P12_PASSWORD }}
          CLICKMORE_NOTARY_APPLE_ID: ${{ secrets.CLICKMORE_NOTARY_APPLE_ID }}
          CLICKMORE_NOTARY_PASSWORD: ${{ secrets.CLICKMORE_NOTARY_PASSWORD }}
          CLICKMORE_NOTARY_TEAM_ID: ${{ secrets.CLICKMORE_NOTARY_TEAM_ID }}
        run: ./script/ci_signing.sh
      - name: Build, sign, notarize, and staple
        if: steps.version.outputs.existing == '0'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./script/package_release.sh "$RELEASE_VERSION"
      - name: Recover immutable artifacts on retry
        if: steps.version.outputs.existing != '0'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p "dist/releases/$RELEASE_VERSION"
          gh release download "v$RELEASE_VERSION" --repo HelgeSverre/clickmore \
            --pattern '*.pkg' --pattern '*.zip' --pattern SHA256SUMS --pattern BUILD_INFO \
            --dir "dist/releases/$RELEASE_VERSION"
      - name: Verify distributables
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./script/verify_release.sh "$RELEASE_VERSION"
      - name: Publish release and update Homebrew
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          TAP_DEPLOY_KEY: ${{ secrets.CLICKMORE_TAP_DEPLOY_KEY }}
        run: |
          umask 077
          test -n "$TAP_DEPLOY_KEY"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$RUNNER_TEMP/clickmore-tap-key"
          # Trust GitHub's published host keys, never an unauthenticated ssh-keyscan.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/clickmore-known-hosts"
          export CLICKMORE_TAP_SSH_COMMAND="ssh -i $RUNNER_TEMP/clickmore-tap-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/clickmore-known-hosts"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ./script/publish_release.sh "$RELEASE_VERSION"
          echo "Release: https://github.com/HelgeSverre/clickmore/releases/tag/v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Save release artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ClickMore-${{ steps.version.outputs.value }}
          path: dist/releases/${{ steps.version.outputs.value }}/
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/clickmore-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/clickmore-application.p12" "$RUNNER_TEMP/clickmore-installer.p12" \
            "$RUNNER_TEMP/clickmore-tap-key" "$RUNNER_TEMP/clickmore-known-hosts"
